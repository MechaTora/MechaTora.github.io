<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>オフラインです｜地震モニター</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);
       font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;color:#fff;padding:24px}
  .box{background:rgba(0,0,0,.45);border-radius:16px;padding:32px 28px;max-width:420px;text-align:center;line-height:1.9}
  h1{font-size:1.3em;margin:0 0 12px}
  p{font-size:.95em;opacity:.9;margin:0 0 10px}
  a{display:inline-block;margin-top:16px;padding:12px 24px;background:#e74c3c;color:#fff;
    text-decoration:none;border-radius:8px;font-weight:bold}
  .note{font-size:.82em;opacity:.75;margin-top:18px}
</style>
</head>
<body>
  <div class="box">
    <h1>📡 オフラインです</h1>
    <p>インターネットに接続できないため、最新の地震情報を取得できません。</p>
    <p>電波状況を確認して、もう一度お試しください。</p>
    <a href="/earthquake-monitor/">再読み込み</a>
    <p class="note">災害時は通信が混み合うことがあります。避難の判断は、ラジオや自治体の防災無線など、通信に頼らない手段でも情報を確認してください。</p>
  </div>
</body>
</html>
