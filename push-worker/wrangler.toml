name = "quake-push"
main = "src/index.js"
compatibility_date = "2026-07-01"

# 1分ごとに気象庁の地震情報をチェック（Cron Triggersの最短間隔）
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "quake-push"
database_id = "48a7eacb-8494-444b-b583-03d7fb78fdb7"

[vars]
# VAPIDの「公開鍵」。秘密鍵は wrangler secret put VAPID_PRIVATE_KEY で登録する
VAPID_PUBLIC_KEY = "BFVHPjmiHJKxRyg75F5zl0VK4k2dlqYXPeIChAy4Jdv_Er2UeS8hEP7qrrEXfW9fOBDL8n6ANKuXIb0uU_JkfXM"
VAPID_SUBJECT = "mailto:crtvybunimofds@gmail.com"
# 通知を出す最小震度（P2Pのscale値: 30=震度3, 40=震度4, 45=震度5弱）
MIN_SCALE = "30"
# CORS許可オリジン
ALLOW_ORIGIN = "https://mechatora.com"
